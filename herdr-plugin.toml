id = "worktrunk"
name = "Worktrunk"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Switch, create, remove, or merge git worktrees via worktrunk"
platforms = ["windows"]

# Windows-only fork of devashish2203/herdr-worktrunk.
# macOS/Linux users: use the original devashish2203/herdr-worktrunk.
#
# On Windows, bare "bash" resolves to WSL bash (C:\Windows\System32\bash.exe),
# which does NOT inherit Windows process env vars unless they are listed in
# WSLENV. Herdr sets HERDR_PLUGIN_ROOT, HERDR_PLUGIN_CONTEXT_JSON,
# HERDR_PLUGIN_CONFIG_DIR, HERDR_WORKSPACE_ID, and HERDR_BIN_PATH as Windows
# process env vars, so WSL bash never sees them. git-bash.cmd finds Git Bash
# (C:\Program Files\Git\usr\bin\bash.exe), which inherits Windows env vars
# natively and launches the script with --login so /usr/bin (jq, fzf, etc.)
# is on PATH.
#
# Herdr resolves "git-bash.cmd" relative to HERDR_PLUGIN_ROOT (the plugin
# directory) and runs it via cmd.exe /d /c. Herdr requires unique action/pane
# ids, so each entry uses a single git-bash.cmd command.

# Workspace actions: open.sh resolves the workspace's repo and the configured
# picker placement, then opens the entrypoint named here.
[[actions]]
id = "open"
title = "Worktree: switch / create from default branch"
contexts = ["workspace"]
command = ["git-bash.cmd", "open.sh", "picker-default"]

[[actions]]
id = "open-current"
title = "Worktree: switch / create from current branch"
contexts = ["workspace"]
command = ["git-bash.cmd", "open.sh", "picker-current"]

[[actions]]
id = "open-with-remotes"
title = "Worktree: switch / create from local or remote branches"
contexts = ["workspace"]
command = ["git-bash.cmd", "open.sh", "picker-with-remotes"]

[[actions]]
id = "remove"
title = "Worktree: remove"
contexts = ["workspace"]
command = ["git-bash.cmd", "open.sh", "remover"]

[[actions]]
id = "merge"
title = "Worktree: merge into the target branch"
contexts = ["workspace"]
command = ["git-bash.cmd", "open.sh", "merger"]

[[actions]]
id = "merge-no-squash"
title = "Worktree: merge into the target branch, keeping every commit"
contexts = ["workspace"]
command = ["git-bash.cmd", "open.sh", "merger-no-squash"]

# Both panes run as plain bash. Depending on plugin config, picker.sh opens the
# checkout in a tab or registers it as a native herdr worktree workspace.
[[panes]]
id = "picker-default"
title = "Worktrunk — default branch"
placement = "split"
command = ["git-bash.cmd", "picker.sh", "--create-base=default"]

[[panes]]
id = "picker-current"
title = "Worktrunk — current branch"
placement = "split"
command = ["git-bash.cmd", "picker.sh", "--create-base=current"]

[[panes]]
id = "picker-with-remotes"
title = "Worktrunk — local and remote branches"
placement = "split"
command = ["git-bash.cmd", "picker.sh", "--show-with-remotes"]

[[panes]]
id = "remover"
title = "Worktrunk — remove"
placement = "split"
command = ["git-bash.cmd", "remove.sh"]

[[panes]]
id = "merger"
title = "Worktrunk — merge"
placement = "split"
command = ["git-bash.cmd", "merge.sh"]

[[panes]]
id = "merger-no-squash"
title = "Worktrunk — merge (no squash)"
placement = "split"
command = ["git-bash.cmd", "merge.sh", "--no-squash"]
