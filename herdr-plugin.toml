id = "worktrunk"
name = "Worktrunk"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Switch, create, remove, or merge git worktrees via worktrunk"
platforms = ["macos", "linux", "windows"]

# On macOS and Linux, bare `bash` is the system shell and inherits env vars
# natively. On Windows, bare `bash` resolves to WSL bash (C:\Windows\System32\
# bash.exe), which does NOT inherit Windows process env vars unless they are
# listed in WSLENV. Herdr sets HERDR_PLUGIN_ROOT, HERDR_PLUGIN_CONTEXT_JSON,
# HERDR_PLUGIN_CONFIG_DIR, HERDR_WORKSPACE_ID, and HERDR_BIN_PATH as Windows
# process env vars, so WSL bash never sees them. git-bash.cmd finds Git Bash
# (C:\Program Files\Git\usr\bin\bash.exe), which inherits Windows env vars
# natively, and launches the script with --login so /usr/bin (jq, fzf, etc.)
# is on PATH.
#
# Each action and pane has a linux/macos entry (bash) and a windows entry
# (git-bash.cmd) that run the same script.

# Workspace actions: open.sh resolves the workspace's repo and the configured
# picker placement, then opens the entrypoint named here.
[[actions]]
id = "open"
title = "Worktree: switch / create from default branch"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/open.sh\" picker-default"]

[[actions]]
id = "open"
title = "Worktree: switch / create from default branch"
contexts = ["workspace"]
platforms = ["windows"]
command = ["git-bash.cmd", "$HERDR_PLUGIN_ROOT/open.sh", "picker-default"]

[[actions]]
id = "open-current"
title = "Worktree: switch / create from current branch"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/open.sh\" picker-current"]

[[actions]]
id = "open-current"
title = "Worktree: switch / create from current branch"
contexts = ["workspace"]
platforms = ["windows"]
command = ["git-bash.cmd", "$HERDR_PLUGIN_ROOT/open.sh", "picker-current"]

[[actions]]
id = "open-with-remotes"
title = "Worktree: switch / create from local or remote branches"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/open.sh\" picker-with-remotes"]

[[actions]]
id = "open-with-remotes"
title = "Worktree: switch / create from local or remote branches"
contexts = ["workspace"]
platforms = ["windows"]
command = ["git-bash.cmd", "$HERDR_PLUGIN_ROOT/open.sh", "picker-with-remotes"]

[[actions]]
id = "remove"
title = "Worktree: remove"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/open.sh\" remover"]

[[actions]]
id = "remove"
title = "Worktree: remove"
contexts = ["workspace"]
platforms = ["windows"]
command = ["git-bash.cmd", "$HERDR_PLUGIN_ROOT/open.sh", "remover"]

[[actions]]
id = "merge"
title = "Worktree: merge into the target branch"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/open.sh\" merger"]

[[actions]]
id = "merge"
title = "Worktree: merge into the target branch"
contexts = ["workspace"]
platforms = ["windows"]
command = ["git-bash.cmd", "$HERDR_PLUGIN_ROOT/open.sh", "merger"]

[[actions]]
id = "merge-no-squash"
title = "Worktree: merge into the target branch, keeping every commit"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/open.sh\" merger-no-squash"]

[[actions]]
id = "merge-no-squash"
title = "Worktree: merge into the target branch, keeping every commit"
contexts = ["workspace"]
platforms = ["windows"]
command = ["git-bash.cmd", "$HERDR_PLUGIN_ROOT/open.sh", "merger-no-squash"]

# Both panes run as plain bash. Depending on plugin config, picker.sh opens the
# checkout in a tab or registers it as a native herdr worktree workspace.
[[panes]]
id = "picker-default"
title = "Worktrunk — default branch"
placement = "split"
platforms = ["linux", "macos"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/picker.sh\" --create-base=default"]

[[panes]]
id = "picker-default"
title = "Worktrunk — default branch"
placement = "split"
platforms = ["windows"]
command = ["git-bash.cmd", "$HERDR_PLUGIN_ROOT/picker.sh", "--create-base=default"]

[[panes]]
id = "picker-current"
title = "Worktrunk — current branch"
placement = "split"
platforms = ["linux", "macos"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/picker.sh\" --create-base=current"]

[[panes]]
id = "picker-current"
title = "Worktrunk — current branch"
placement = "split"
platforms = ["windows"]
command = ["git-bash.cmd", "$HERDR_PLUGIN_ROOT/picker.sh", "--create-base=current"]

[[panes]]
id = "picker-with-remotes"
title = "Worktrunk — local and remote branches"
placement = "split"
platforms = ["linux", "macos"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/picker.sh\" --show-with-remotes"]

[[panes]]
id = "picker-with-remotes"
title = "Worktrunk — local and remote branches"
placement = "split"
platforms = ["windows"]
command = ["git-bash.cmd", "$HERDR_PLUGIN_ROOT/picker.sh", "--show-with-remotes"]

[[panes]]
id = "remover"
title = "Worktrunk — remove"
placement = "split"
platforms = ["linux", "macos"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/remove.sh\""]

[[panes]]
id = "remover"
title = "Worktrunk — remove"
placement = "split"
platforms = ["windows"]
command = ["git-bash.cmd", "$HERDR_PLUGIN_ROOT/remove.sh"]

[[panes]]
id = "merger"
title = "Worktrunk — merge"
placement = "split"
platforms = ["linux", "macos"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/merge.sh\""]

[[panes]]
id = "merger"
title = "Worktrunk — merge"
placement = "split"
platforms = ["windows"]
command = ["git-bash.cmd", "$HERDR_PLUGIN_ROOT/merge.sh"]

[[panes]]
id = "merger-no-squash"
title = "Worktrunk — merge (no squash)"
placement = "split"
platforms = ["linux", "macos"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/merge.sh\" --no-squash"]

[[panes]]
id = "merger-no-squash"
title = "Worktrunk — merge (no squash)"
placement = "split"
platforms = ["windows"]
command = ["git-bash.cmd", "$HERDR_PLUGIN_ROOT/merge.sh", "--no-squash"]
