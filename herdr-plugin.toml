id = "worktrunk"
name = "Worktrunk"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Switch, create, remove, or merge git worktrees via worktrunk"
platforms = ["windows"]

# Windows-only fork of devashish2203/herdr-worktrunk.
# macOS/Linux users: use the original devashish2203/herdr-worktrunk.
#
# On Windows, bare "bash" resolves to WSL bash (C:\Windows\System32\bash.exe),
# which does NOT inherit Windows process env vars unless they are listed in
# WSLENV. Herdr sets HERDR_PLUGIN_ROOT, HERDR_PLUGIN_CONTEXT_JSON,
# HERDR_PLUGIN_CONFIG_DIR, HERDR_WORKSPACE_ID, and HERDR_BIN_PATH as Windows
# process env vars, so WSL bash never sees them. git-bash.cmd finds Git Bash
# (C:\Program Files\Git\usr\bin\bash.exe), which inherits Windows env vars
# natively and launches the script with --login so /usr/bin (jq, fzf, etc.)
# is on PATH.
#
# Herdr resolves "git-bash.cmd" relative to HERDR_PLUGIN_ROOT (the plugin
# directory) for action commands and runs it via cmd.exe /d /c.
#
# There are NO [[panes]] entries: herdr cannot spawn a relative pane command on
# Windows (CreateProcessW resolves it against herdr's own directory, not the
# plugin root or --cwd). Instead, open.sh uses `herdr pane split` + `herdr pane
# run` with an absolute path to git-bash.cmd + the script. This is the same
# pattern used by herdr-file-viewer (see its scripts/open-file-viewer.ps1).

# Workspace actions: open.sh resolves the workspace's repo, splits a pane,
# and runs the entrypoint's script (picker.sh, remove.sh, merge.sh) in it.
[[actions]]
id = "open"
title = "Worktree: switch / create from default branch"
contexts = ["workspace"]
command = ["git-bash.cmd", "open.sh", "picker-default"]

[[actions]]
id = "open-current"
title = "Worktree: switch / create from current branch"
contexts = ["workspace"]
command = ["git-bash.cmd", "open.sh", "picker-current"]

[[actions]]
id = "open-with-remotes"
title = "Worktree: switch / create from local or remote branches"
contexts = ["workspace"]
command = ["git-bash.cmd", "open.sh", "picker-with-remotes"]

[[actions]]
id = "remove"
title = "Worktree: remove"
contexts = ["workspace"]
command = ["git-bash.cmd", "open.sh", "remover"]

[[actions]]
id = "merge"
title = "Worktree: merge into the target branch"
contexts = ["workspace"]
command = ["git-bash.cmd", "open.sh", "merger"]

[[actions]]
id = "merge-no-squash"
title = "Worktree: merge into the target branch, keeping every commit"
contexts = ["workspace"]
command = ["git-bash.cmd", "open.sh", "merger-no-squash"]
